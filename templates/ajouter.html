<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ajouter une Épreuve - Série C4</title>

  <link rel="icon" type="image/png" href="https://th.bing.com/th/id/R.912ca27104d32600072db4ba5ab58853?rik=IH2q45a%2flWh9gA&pid=ImgRaw&r=0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <style>
    /* Styles spécifiques au formulaire Glassmorphism */
    .form-container {
      max-width: 750px;
      margin: 40px auto;
      padding: 35px;
      background: rgba(255, 255, 255, 0.45);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
    }

    body.dark-mode .form-container {
      background: rgba(15, 23, 42, 0.65);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header h1 {
      font-family: 'Lobster', cursive;
      font-size: 2.2rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    body.dark-mode .form-header h1 {
      color: #f8fafc;
    }

    .form-header p {
      color: #475569;
      font-size: 0.95rem;
    }

    body.dark-mode .form-header p {
      color: #94a3b8;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-group label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    body.dark-mode .form-group label {
      color: #e2e8f0;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.7);
      color: #0f172a;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }

    body.dark-mode .form-control {
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(255, 255, 255, 0.15);
      color: #f8fafc;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    /* --- Styles pour la bulle d'assistance IA (Glassmorphism) --- */
    .ia-suggestion-box {
      margin-top: 10px;
      padding: 12px 16px;
      background: rgba(147, 51, 234, 0.08);
      border: 1px solid rgba(147, 51, 234, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      backdrop-filter: blur(8px);
      animation: fadeIn 0.3s ease-in-out;
    }

    body.dark-mode .ia-suggestion-box {
      background: rgba(168, 85, 247, 0.15);
      border-color: rgba(168, 85, 247, 0.4);
    }

    .ia-suggestion-content {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      color: #6b21a8;
      font-style: italic;
    }

    body.dark-mode .ia-suggestion-content {
      color: #e9d5ff;
    }

    .ia-icon {
      color: #9333ea;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    body.dark-mode .ia-icon {
      color: #c084fc;
    }

    .btn-appliquer-ia {
      background: linear-gradient(135deg, #9333ea, #7c3aed);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.25);
    }

    .btn-appliquer-ia:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(147, 51, 234, 0.35);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 20px;
      transition: color 0.2s ease;
    }

    body.dark-mode .btn-back {
      color: #38bdf8;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group.full-width {
        grid-column: span 1;
      }
      .ia-suggestion-box {
        flex-direction: column;
        align-items: flex-start;
      }
      .btn-appliquer-ia {
        width: 100%;
        justify-content: center;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div style="max-width: 1100px; margin: 20px auto; padding: 0 20px;">
    <a href="{{ url_for('home') }}" class="btn-back">
      <i class="fas fa-arrow-left"></i> Retour à l'accueil
    </a>

    <div class="form-container">
      <div class="form-header">
        <h1><i class="fas fa-cloud-upload-alt"></i> Ajouter une Épreuve</h1>
        <p>Partagez un sujet ou un devoir pour enrichir la communauté scientifique C4.</p>
      </div>

      <form action="{{ url_for('ajouter') }}" method="POST" enctype="multipart/form-data">
        <div class="form-grid">

          <div class="form-group full-width">
            <label for="titre"><i class="fas fa-heading"></i> Titre de l'épreuve</label>
            <input type="text" id="titre" name="titre" class="form-control" placeholder="Ex: Devoir de Mathématiques - Nombres Complexes" required>
          </div>

          <div class="form-group">
            <label for="matiere"><i class="fas fa-book"></i> Domaine / Matière</label>
            <select id="matiere" name="matiere" class="form-control" required>
              <option value="" disabled selected>Sélectionner la matière</option>
              <option value="math">📐 Mathématiques</option>
              <option value="physique">⚛️ Physique-Chimie</option>
              <option value="svt">🧬 SVT</option>
              <option value="philosophie">🧠 Philosophie</option>
              <option value="francais">✒️ Français</option>
              <option value="anglais">🌐 Anglais</option>
              <option value="histoire_geographie">🌍 Histoire-Géographie</option>
              <option value="autres">🎨 Autres Matières</option>
            </select>
          </div>

          <div class="form-group">
            <label for="categorie"><i class="fas fa-layer-group"></i> Catégorie</label>
            <select id="categorie" name="categorie" class="form-control" required>
              <option value="" disabled selected>Sélectionner la catégorie</option>
              <option value="bac">Examens Officiels (BAC I & II)</option>
              <option value="national">Épreuves Nationales & Scientifiques</option>
              <option value="etablissement">Épreuves d'Établissement</option>
              <option value="facultatif">Matières Facultatives</option>
              <option value="bibliotheque">Bibliothèque & Annales</option>
            </select>
          </div>

          <div class="form-group">
            <label for="badge"><i class="fas fa-tag"></i> Type d'évaluation (Optionnel)</label>
            <select id="badge" name="badge" class="form-control">
              <option value="" selected>Sélectionner un type (optionnel)</option>
              <option value="Devoir N°1">Devoir N°1</option>
              <option value="Devoir N°2">Devoir N°2</option>
              <option value="Devoir N°3">Devoir N°3</option>
              <option value="Composition">Composition</option>
              <option value="Examen Blanc">Examen Blanc</option>
              <option value="BAC Officiel">BAC Officiel</option>
              <option value="Autres">Autres</option>
            </select>
          </div>

          <div class="form-group">
            <label for="annee"><i class="fas fa-calendar-alt"></i> Année académique (Optionnelle)</label>
            <input type="text" id="annee" name="annee" class="form-control" placeholder="Ex: 2025 (optionnel)">
          </div>

          <div class="form-group full-width">
            <label for="description"><i class="fas fa-align-left"></i> Description ou remarques</label>
            <textarea id="description" name="description" class="form-control" placeholder="Commencez à saisir la description (ex: Contient le sujet et le corrigé...) et l'IA vous aidera..." required></textarea>
            
            <div id="ia-suggestion-box" class="ia-suggestion-box" style="display: none;">
              <div class="ia-suggestion-content">
                <i class="fas fa-robot ia-icon"></i>
                <span id="ia-suggestion-text"></span>
              </div>
              <button type="button" id="btn-appliquer-ia" class="btn-appliquer-ia">
                <i class="fas fa-magic"></i> Accepter la suggestion
              </button>
            </div>
          </div>

          <div class="form-group full-width">
            <label for="fichier_pdf"><i class="fas fa-file-pdf"></i> Document PDF de l'épreuve</label>
            <input type="file" id="fichier_pdf" name="fichier_pdf" class="form-control" accept=".pdf" required>
          </div>

        </div>

        <button type="submit" class="btn-submit">
          <i class="fas fa-paper-plane"></i> Publier l'épreuve
        </button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='theme.js') }}"></script>

  <script>
    const descriptionInput = document.getElementById('description');
    const suggestionBox = document.getElementById('ia-suggestion-box');
    const suggestionText = document.getElementById('ia-suggestion-text');
    const btnAppliquer = document.getElementById('btn-appliquer-ia');

    let typingTimer;
    let derniereSuggestion = "";

    if (descriptionInput && suggestionBox && suggestionText && btnAppliquer) {
      descriptionInput.addEventListener('input', () => {
        clearTimeout(typingTimer);
        const texteSaisi = descriptionInput.value.trim();

        if (texteSaisi.length < 5) {
          suggestionBox.style.display = 'none';
          return;
        }

        typingTimer = setTimeout(async () => {
          const titre = document.getElementById('titre') ? document.getElementById('titre').value : '';
          const matiere = document.getElementById('matiere') ? document.getElementById('matiere').value : '';

          try {
            const response = await fetch('/api/ia_assistant', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ 
                titre: titre, 
                matiere: matiere, 
                texte_saisi: texteSaisi 
              })
            });

            if (!response.ok) return;

            const data = await response.json();
            if (data.suggestion && data.suggestion !== texteSaisi) {
              derniereSuggestion = data.suggestion;
              suggestionText.textContent = data.suggestion;
              suggestionBox.style.display = 'flex';
            }
          } catch (err) {
            console.log("IA non disponible actuellement");
          }
        }, 800);
      });

      btnAppliquer.addEventListener('click', () => {
        if (derniereSuggestion) {
          descriptionInput.value = derniereSuggestion;
          suggestionBox.style.display = 'none';
        }
      });
    }
  </script>
</body>

</html>
