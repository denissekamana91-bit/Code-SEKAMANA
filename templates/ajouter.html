<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajouter une Épreuve - Série C4</title>

    <link
      rel="icon"
      type="image/png"
      href="https://th.bing.com/th/id/R.912ca27104d32600072db4ba5ab58853?rik=IH2q45a%2flWh9gA&pid=ImgRaw&r=0"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&family=Noto+Color+Emoji&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Styles spécifiques au formulaire Glassmorphism */
      .form-container {
        max-width: 750px;
        margin: 40px auto;
        padding: 35px;
        background: rgba(255, 255, 255, 0.45);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
      }

      body.dark-mode .form-container {
        background: rgba(15, 23, 42, 0.65);
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .form-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .form-header h1 {
        font-family: "Lobster", cursive;
        font-size: 2.2rem;
        color: #0f172a;
        margin-bottom: 8px;
      }

      body.dark-mode .form-header h1 {
        color: #f8fafc;
      }

      .form-header p {
        color: #475569;
        font-size: 0.95rem;
      }

      body.dark-mode .form-header p {
        color: #94a3b8;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
      }

      .form-group.full-width {
        grid-column: span 2;
      }

      .form-group label {
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 8px;
        color: #1e293b;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      body.dark-mode .form-group label {
        color: #e2e8f0;
      }

      .form-control {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: rgba(255, 255, 255, 0.7);
        color: #0f172a;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s ease;
        box-sizing: border-box;
      }

      body.dark-mode .form-control {
        background: rgba(30, 41, 59, 0.7);
        border-color: rgba(255, 255, 255, 0.15);
        color: #f8fafc;
      }

      .form-control:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
      }

      textarea.form-control {
        resize: vertical;
        min-height: 100px;
      }

      .btn-submit {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        transition: all 0.3s ease;
      }

      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
      }

      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 20px;
        transition: color 0.2s ease;
      }

      body.dark-mode .btn-back {
        color: #38bdf8;
      }

      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .form-group.full-width {
          grid-column: span 1;
        }
      }
    </style>
  </head>

  <body>
    <div style="max-width: 1100px; margin: 20px auto; padding: 0 20px">
      <a href="{{ url_for('home') }}" class="btn-back">
        <i class="fas fa-arrow-left"></i> Retour à l'accueil
      </a>

      <div class="form-container">
        <div class="form-header">
          <h1><i class="fas fa-cloud-upload-alt"></i> Ajouter une Épreuve</h1>
          <p>
            Partagez un sujet ou un devoir pour enrichir la communauté
            scientifique C4.
          </p>
        </div>

        <form
          action="{{ url_for('ajouter') }}"
          method="POST"
          enctype="multipart/form-data"
        >
          <div class="form-grid">
            <div class="form-group full-width">
              <label for="titre"
                ><i class="fas fa-heading"></i> Titre de l'épreuve</label
              >
              <input
                type="text"
                id="titre"
                name="titre"
                class="form-control"
                placeholder="Ex: Devoir de Mathématiques - Nombres Complexes"
                required
              />
            </div>

            <div class="form-group">
              <label for="matiere"
                ><i class="fas fa-book"></i> Domaine / Matière</label
              >
              <select id="matiere" name="matiere" class="form-control" required>
                <option value="" disabled selected>
                  Sélectionner la matière
                </option>
                <option value="math">📐 Mathématiques</option>
                <option value="physique">⚛️ Physique-Chimie</option>
                <option value="svt">🧬 SVT</option>
                <option value="philosophie">🧠 Philosophie</option>
                <option value="francais">✒️ Français</option>
                <option value="anglais">🌐 Anglais</option>
                <option value="espagnol">🇪🇸 Espagnol</option>
                <option value="allemand">🍻 Allemand</option>
                <option value="histoire_geographie">
                  🌍 Histoire-Géographie
                </option>
                <option value="education_civique">📖 ECM</option>
                <option value="musique">🎵 Musique</option>
                <option value="dessin">🎨Dessin</option>
                <option value="autres">🗂Autres Matières</option>
              </select>
            </div>

            <div class="form-group">
              <label for="categorie"
                ><i class="fas fa-layer-group"></i> Catégorie</label
              >
              <select
                id="categorie"
                name="categorie"
                class="form-control"
                required
              >
                <option value="" disabled selected>
                  Sélectionner la catégorie
                </option>
                <option value="bac">Examens Officiels (BAC I & II)</option>
                <option value="national">
                  Épreuves Nationales & Scientifiques
                </option>
                <option value="etablissement">Épreuves d'Établissement</option>
                <option value="facultatif">Matières Facultatives</option>
                <option value="bibliotheque">Bibliothèque & Annales</option>
                <option value="autres">
                  Autres Epreuves et ressources divers
                </option>
              </select>
            </div>

            <div class="form-group">
              <label for="badge"
                ><i class="fas fa-tag"></i> Type d'évaluation</label
              >
              <select id="badge" name="badge" class="form-control">
                <option value="" disabled selected>
                  Sélectionner le type d’évaluation
                </option>
                <option value="Devoir N°1">Devoir N°1</option>
                <option value="Devoir N°2">Devoir N°2</option>
                <option value="Devoir N°3">Devoir N°3</option>
                <option value="Composition">Composition</option>
                <option value="Examen Blanc">Examen Blanc</option>
                <option value="BAC Officiel">BAC Officiel</option>
              </select>
            </div>

            <div class="form-group">
              <label for="annee"
                ><i class="fas fa-calendar-alt"></i> Année académique</label
              >
              <input
                type="number"
                id="annee"
                name="annee"
                class="form-control"
                placeholder="Ex: 2025"
                min="2000"
                max="2030"
                value=""
              />
            </div>
            <div class="form-group">
              <label for="niveau"
                ><i class="fas fa-layer-group"></i> Niveau d'étude</label
              >
              <select id="niveau" name="niveau" class="form-control">
                <option value="" disabled selected>
                  Sélectionner le niveau
                </option>
                <!-- Les 'value' doivent correspondre exactement à ce que tu as dans ton menu et ton code Python -->
                <option value="2nde_S">Seconde S</option>
                <option value="1ere_c4">Première C4</option>
                <option value="tle_c4">Terminale C4</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label for="description"
                ><i class="fas fa-align-left"></i> Description ou
                remarques</label
              >
              <textarea
                id="description"
                name="description"
                class="form-control"
                placeholder="Ex: Contient le sujet et le corrigé détaillé du Lycée Scientifique de Lomé..."
              ></textarea>
            </div>

            <div class="form-group full-width">
              <label for="fichier_pdf"
                ><i class="fas fa-file-pdf"></i> Document PDF de
                l'épreuve</label
              >
              <input
                type="file"
                id="fichier_pdf"
                name="fichier_pdf"
                class="form-control"
                accept=".pdf"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <i class="fas fa-paper-plane"></i> Publier l'épreuve
          </button>
        </form>
      </div>
    </div>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
  </body>
</html>
